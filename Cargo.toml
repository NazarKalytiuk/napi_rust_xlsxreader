[package]
name = "rusc-xlsx-reader"
version = "1.0.0"
authors = ["Nazarii Kalytiuk <nazarkwork@gmail.com>"]
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Fast Node.js XLSX reader powered by Calamine and NAPI-RS"
repository = "https://github.com/NazarKalytiuk/napi_rust_xlsxreader"

[lib]
crate-type = ["cdylib"]

[dependencies]
calamine = { version = "0.36.1", features = ["chrono"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
crossbeam-channel = "0.5"
napi = { version = "3.12.0", features = ["napi9", "chrono_date"] }
napi-derive = "3.6.2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
