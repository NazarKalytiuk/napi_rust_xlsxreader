[package]
name = "rusc-xlsx-reader"
version = "1.0.1"
authors = ["Nazarii Kalytiuk <nazarkwork@gmail.com>"]
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Fast Node.js XLSX reader powered by Calamine and NAPI-RS"
repository = "https://github.com/NazarKalytiuk/napi_rust_xlsxreader"

[lib]
crate-type = ["cdylib"]

[dependencies]
calamine = { version = "0.38.0", features = ["chrono"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
crossbeam-channel = "0.5.17"
napi = { version = "3.16.2", features = ["napi9", "chrono_date"] }
napi-derive = "3.7.1"

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
